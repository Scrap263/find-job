services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: findjob
      POSTGRES_PASSWORD: findjob
      POSTGRES_USER: findjob
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U findjob -d findjob
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
